
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Challenge</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Fireworks canvas -->
    <canvas id="fireworks"></canvas>

    <div class="quiz-container">
        <h1>DevOps Challenge</h1>
        <p>Test your knowledge of GitHub, Docker, and VS Code!</p>

        <div id="quiz">
            <h2 id="question">Question goes here</h2>

            <div id="answers">
                <button class="answer-btn"></button>
                <button class="answer-btn"></button>
                <button class="answer-btn"></button>
                <button class="answer-btn"></button>
            </div>

            <p id="feedback"></p>
            <p id="progress"></p>

            <button id="next-btn" class="hidden">Next Question</button>
        </div>

        <div id="result" class="hidden">
            <h2>Quiz Completed!</h2>
            <p id="score"></p>

            <!-- Trophy appears only when score is greater than 7 -->
            <div id="trophy" class="hidden">
                <div class="trophy-icon">🏆</div>
                <h2>Congratulations!</h2>
                <p>You are a DevOps Champion!</p>
            </div>

            <button id="restart-btn">Play Again</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
